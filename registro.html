<section class="container py-5">
    <h1>Registro de usuario</h1>

    <form class="formulario">
        <label>Nombre completo</label>
        <input type="text" class="form-control mb-3" placeholder="Nombre completo">

        <label>Documento de identificación</label>
        <input type="text" class="form-control mb-3" placeholder="Documento">

        <label>Correo electrónico</label>
        <input type="email" class="form-control mb-3" placeholder="Correo">

        <label>Usuario</label>
        <input type="text" class="form-control mb-3" placeholder="Usuario">

        <label>Contraseña</label>
        <input type="password" class="form-control mb-3" placeholder="Contraseña">

        <label>Confirmar contraseña</label>
        <input type="password" class="form-control mb-3" placeholder="Confirmar contraseña">

        <button type="submit" class="btn btn-dark">Registrarme</button>
    </form>
