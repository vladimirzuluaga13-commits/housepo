<section class="container py-5">
    <h1>Contáctanos</h1>
    <p>Si tienes una pregunta o recomendación sobre House Music, puedes escribirnos.</p>

    <form class="formulario">
        <label>Nombre</label>
        <input type="text" class="form-control mb-3" placeholder="Tu nombre">

        <label>Correo</label>
        <input type="email" class="form-control mb-3" placeholder="correo@ejemplo.com">

        <label>Teléfono</label>
        <input type="tel" class="form-control mb-3" placeholder="Teléfono">

        <label>Mensaje</label>
        <textarea class="form-control mb-3" rows="4" placeholder="Escribe tu mensaje"></textarea>

        <button type="submit" class="btn btn-dark">Enviar</button>
    </form>
