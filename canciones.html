<section class="container py-5">
    <h1>Registrar canción</h1>
    <p>Agrega una canción de House que quieras recomendar.</p>

    <form class="formulario">
        <label>Nombre de la canción</label>
        <input type="text" class="form-control mb-3" placeholder="Ejemplo: One More Time">

        <label>Artista</label>
        <input type="text" class="form-control mb-3" placeholder="Nombre del artista">

        <label>Tipo de House</label>
        <select class="form-select mb-3">
            <option>Deep House</option>
            <option>Tech House</option>
            <option>Progressive House</option>
        </select>

        <label>Año</label>
        <input type="number" class="form-control mb-3" placeholder="2026">

        <button type="submit" class="btn btn-dark">Registrar canción</button>
    </form>
</section>

<footer>
    <p>Vladimir Zuluaga Guíral - House Music</p>
